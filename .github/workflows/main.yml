name : Deploy site on push to main

on :
  push:
    branches:
     - main
     
jobs :
  web-deploy :
    name : Deploy
    runs-on : ubuntu-latest
    steps:
      - name : Get latest code
        uses : actions/checkout@v2
      - name : Sync files
        uses : SamKirkland/FTP-DeployAction@4.1.0
        with :
          server : ftp.clinicannabis.com.co
          username : ${{secrets.CICD_USR_FTP}}
          password : ${{secrets.CICD_HSH_FTP}}
          server-dir : /public_html
