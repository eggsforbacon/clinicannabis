name : Deploy site on push to main

on :
  push:
    branches:
     - main
     
jobs :
  web-deploy :
    name : Deploy
    runs-on : ubuntu-latest
    steps:
      - name : Get latest code
        uses : actions/checkout@v2
      - name : Use Node.js 18
        uses : actions/setup-node@v2
        with :
          node-version: '18'
      - name : Build app
        run : |
          - npm install
          - next build
          - next start
      - name : Sync files
        uses : SamKirkland/FTP-Deploy-Action@4.1.0
        with :
          server : ftp.clinicannabis.com.co
          username : ${{secrets.CICD_USR_FTP}}
          password : ${{secrets.CICD_HSH_FTP}}
          local-dir : /build
          server-dir : /public_html
